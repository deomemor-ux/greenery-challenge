<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>10월의 도전</title>
  
  <!-- 스마트폰 바탕화면 앱 이름 및 아이콘 설정 -->
  <meta name="apple-mobile-web-app-title" content="10월의 도전">
  <meta name="application-name" content="10월의 도전">
  <meta name="theme-color" content="#f5f5f4">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased h-screen overflow-hidden">
  
  <div id="root" class="h-full"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    // 선생님의 실제 Firebase 클라우드 연동 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCpwLH3fRWpQ1xliA5d_m_FdiAE-xDhAbs",
      authDomain: "greenery-challenge.firebaseapp.com",
      projectId: "greenery-challenge",
      storageBucket: "greenery-challenge.firebasestorage.app",
      messagingSenderId: "298325763637",
      appId: "1:298325763637:web:94dc672e29d3cb6997337c",
      measurementId: "G-3VKE3PXEZ3"
    };

    let db = null;
    let auth = null;
    const dataPath = `artifacts/greenery-challenge-v3/public/data/greenery_challenge`;

    const defaultUsers = [
      { id: 0, name: '작약세계', goals: [{text:'', freq:7}, {text:'', freq:7}, {text:'', freq:7}] },
      { id: 1, name: 'Fern', goals: [{text:'', freq:7}, {text:'', freq:7}, {text:'', freq:7}] },
      { id: 2, name: 'hereNnow', goals: [{text:'', freq:7}, {text:'', freq:7}, {text:'', freq:7}] },
      { id: 3, name: '수국정원', goals: [{text:'', freq:7}, {text:'', freq:7}, {text:'', freq:7}] }
    ];

    const holidays = [3, 5, 9];

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      signInAnonymously(auth).catch(console.error);
    } catch(e) { console.error("Cloud DB Init Error:", e); }

    window.AppRuntime = { db, dataPath, defaultUsers, holidays, doc, onSnapshot, setDoc, getDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const runtime = window.AppRuntime || {};
    const db = runtime.db;
    const dataPath = runtime.dataPath || 'greenery_challenge';
    const defaultUsers = runtime.defaultUsers || [];
    const holidays = runtime.holidays || [];

    const App = () => {
      const [users, setUsers] = useState(defaultUsers);
      const [records, setRecords] = useState({});
      const [view, setView] = useState('calendar'); 
      
      const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
      const [selectedDate, setSelectedDate] = useState(null);
      const [activeUserTab, setActiveUserTab] = useState(0);
      const [reportUserId, setReportUserId] = useState(null);

      useEffect(() => {
        if (!db) return;
        const usersRef = window.AppRuntime.doc(db, dataPath, 'config');
        const recordsRef = window.AppRuntime.doc(db, dataPath, 'records');

        const initData = async () => {
          try {
            const snap = await window.AppRuntime.getDoc(usersRef);
            if (!snap.exists()) await window.AppRuntime.setDoc(usersRef, { users: defaultUsers });
            const recSnap = await window.AppRuntime.getDoc(recordsRef);
            if (!recSnap.exists()) await window.AppRuntime.setDoc(recordsRef, {});
          } catch(e) { console.error(e); }
        };
        initData();

        const unsubUsers = window.AppRuntime.onSnapshot(usersRef, (docSnap) => {
          if (docSnap.exists() && docSnap.data().users) setUsers(docSnap.data().users);
        });
        const unsubRecords = window.AppRuntime.onSnapshot(recordsRef, (docSnap) => {
          if (docSnap.exists()) setRecords(docSnap.data());
          else setRecords({});
        });

        return () => { unsubUsers(); unsubRecords(); };
      }, [db]);

      const getDayOfWeek = (day) => new Date(2026, 9, day).getDay(); 
      const isOptionalDay = (day) => {
        const dow = getDayOfWeek(day);
        return dow === 0 || dow === 6 || holidays.includes(day);
      };
      const getCheckState = (c) => {
        if (c === true) return 1; 
        if (c === false) return 0; 
        return c || 0; 
      };
      
      const getGoalObj = (goal) => {
        if (typeof goal === 'string') return { text: goal, freq: 7 };
        return goal || { text: '', freq: 7 };
      };

      // 주 단위 캡(Cap) 적용 진정한 달성률 계산 로직 (일~토 기준)
      const calculateProgress = (userId, goalIndex = null) => {
        const user = users.find(u => u.id === userId) || defaultUsers[userId];
        
        const getPctForSingleGoal = (idx) => {
          const goalObj = getGoalObj(user.goals[idx]);
          const freq = goalObj.freq || 7;
          
          const weeks = [
            [2, 3], // 1주차 (금, 토)
            [4, 5, 6, 7, 8, 9, 10], // 2주차 (일~토)
            [11, 12, 13, 14, 15, 16, 17], // 3주차
            [18, 19, 20, 21, 22, 23, 24], // 4주차
            [25, 26, 27, 28, 29, 30, 31]  // 5주차
          ];

          let totalTarget = 0;
          let totalAchieved = 0;

          weeks.forEach(weekDays => {
            const targetThisWeek = Math.min(freq, weekDays.length);
            let achievedThisWeek = 0;

            weekDays.forEach(d => {
              const dateStr = `2026-10-${String(d).padStart(2, '0')}`;
              const state = getCheckState((records[dateStr]?.[userId]?.checks || [0,0,0])[idx]);
              if (state === 1) {
                achievedThisWeek++;
              }
            });

            totalAchieved += Math.min(achievedThisWeek, targetThisWeek);
            totalTarget += targetThisWeek;
          });

          if (totalTarget === 0) return 0;
          return Math.min(100, Math.round((totalAchieved / totalTarget) * 100)); 
        };

        if (goalIndex !== null) return getPctForSingleGoal(goalIndex);
        
        const avg = (getPctForSingleGoal(0) + getPctForSingleGoal(1) + getPctForSingleGoal(2)) / 3;
        return Math.round(avg) || 0;
      };

      // 영문 파일명이 적용된 성장 단계별 이미지 매핑 함수
      const getGrowthImage = (userId, pct) => {
        if (pct <= 20) {
          return "stage1.png"; // 1단계: 물뿌리개
        } else if (pct <= 40) {
          return "stage2.png"; // 2단계: 새싹
        } else if (pct <= 60) {
          return "stage3.png"; // 3단계: 풍성한 묘목
        } else if (pct <= 80) {
          // 4단계: 사용자별 봉오리 (작약, Fern, hereNnow, 수국정원 순)
          const stage4 = ["peony_4.png", "fern_4.png", "herennow_4.png", "hydrangea_4.png"];
          return stage4[userId] || stage4[0];
        } else {
          // 5단계: 사용자별 만개한 꽃 (작약, Fern, hereNnow, 수국정원 순)
          const stage5 = ["peony_5.png", "fern_5.png", "herennow_5.png", "hydrangea_5.png"];
          return stage5[userId] || stage5[0];
        }
      };

      const GoalSettingModal = () => {
        const [tempUsers, setTempUsers] = useState(JSON.parse(JSON.stringify(users)));
        const [isSaving, setIsSaving] = useState(false);

        const handleSave = async () => {
          setIsSaving(true);
          if (db) {
            await window.AppRuntime.setDoc(window.AppRuntime.doc(db, dataPath, 'config'), { users: tempUsers });
          }
          setIsGoalModalOpen(false);
          setIsSaving(false);
        };

        const updateGoal = (uid, gIdx, valueObj) => {
          const newUsers = [...tempUsers];
          const user = newUsers.find(u => u.id === uid);
          user.goals[gIdx] = valueObj;
          setTempUsers(newUsers);
        };

        return (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
            <div className="bg-stone-50 w-full max-w-md h-[90vh] sm:h-[80vh] rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
              <div className="flex justify-between items-center p-5 bg-white border-b border-stone-200">
                <h2 className="text-xl font-bold text-lime-900">목표 설정 및 다짐</h2>
                <button onClick={() => setIsGoalModalOpen(false)} className="text-stone-400 hover:text-stone-600">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>
              <div className="flex-1 overflow-y-auto p-5 space-y-6">
                <p className="text-[13px] text-stone-600 bg-lime-50 p-3 rounded-lg border border-lime-100 leading-tight">
                  🌿 10월 한 달 동안 지킬 목표를 적어주세요. '주 N회'를 설정하면 횟수에 맞춰 달성률이 자동 계산됩니다!
                </p>
                {tempUsers.map((u, i) => (
                  <div key={u.id} className="bg-white p-4 rounded-xl shadow-sm border border-stone-100">
                    <div className="w-full text-lg font-bold text-lime-900 bg-transparent border-b-2 border-lime-200 pb-1 mb-3">
                      {u.name}
                    </div>
                    <div className="space-y-3">
                      {[0,1,2].map(gIndex => {
                        const goalObj = getGoalObj(u.goals[gIndex]);
                        return (
                          <div key={gIndex} className="flex items-center space-x-2">
                            <span className="text-lime-600 font-medium text-sm">{gIndex + 1}.</span>
                            <input 
                              type="text" value={goalObj.text} onChange={(e) => updateGoal(u.id, gIndex, { ...goalObj, text: e.target.value })}
                              placeholder="목표를 입력하세요"
                              className="flex-1 min-w-0 text-sm bg-stone-50 border border-stone-200 rounded-md px-3 py-2 outline-none focus:ring-1 focus:ring-lime-500"
                            />
                            <select 
                              value={goalObj.freq} onChange={(e) => updateGoal(u.id, gIndex, { ...goalObj, freq: Number(e.target.value) })}
                              className="bg-stone-50 border border-stone-200 text-stone-600 text-[13px] rounded-md px-1 py-2 outline-none shrink-0 focus:ring-1 focus:ring-lime-500"
                            >
                              <option value={7}>매일</option>
                              <option value={1}>주 1회</option>
                              <option value={2}>주 2회</option>
                              <option value={3}>주 3회</option>
                              <option value={4}>주 4회</option>
                              <option value={5}>주 5회</option>
                              <option value={6}>주 6회</option>
                            </select>
                          </div>
                        )
                      })}
                    </div>
                  </div>
                ))}
              </div>
              <div className="p-4 bg-white border-t border-stone-200">
                <button onClick={handleSave} disabled={isSaving} className="w-full bg-lime-700 text-white font-bold py-4 rounded-xl shadow-md hover:bg-lime-800 transition active:scale-[0.98]">
                  {isSaving ? '저장 중...' : '모두 저장하기'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      const DailyDetailModal = () => {
        const [memoText, setMemoText] = useState('');
        
        const dayRecord = records[selectedDate] || {};
        const userRecord = dayRecord[activeUserTab] || { checks: [0, 0, 0], memo: '', emojis: {} };
        const checks = (userRecord.checks || [0,0,0]).map(getCheckState);

        const applyPinpointUpdate = async (newData) => {
          if (!db) return;
          const specificUpdate = {
            [selectedDate]: {
              [activeUserTab]: {
                checks: userRecord.checks || [0,0,0],
                memo: userRecord.memo || '',
                emojis: userRecord.emojis || {},
                ...newData
              }
            }
          };
          await window.AppRuntime.setDoc(window.AppRuntime.doc(db, dataPath, 'records'), specificUpdate, { merge: true });
        };

        const toggleCheck = async (goalIndex) => {
          const newChecks = [...checks];
          newChecks[goalIndex] = (newChecks[goalIndex] + 1) % 3; 
          await applyPinpointUpdate({ checks: newChecks });
        };

        const saveMemo = async () => {
          if (!memoText.trim()) return;
          await applyPinpointUpdate({ memo: memoText });
          setMemoText('');
        };

        const handleEmoji = async (cheerText) => {
          const currentEmojis = userRecord.emojis || {};
          const count = (currentEmojis[cheerText] || 0) + 1;
          await applyPinpointUpdate({ emojis: { ...currentEmojis, [cheerText]: count } });
        };

        const activeUser = users.find(u => u.id === activeUserTab) || defaultUsers[activeUserTab];
        const displayDate = selectedDate ? selectedDate.split('-') : ['','',''];

        const cheerOptions = [
          { icon: '🌟', text: '대단해요' },
          { icon: '💪', text: '힘내요' },
          { icon: '🔥', text: '포기마요' },
          { icon: '☕', text: '좀 쉬어요' }
        ];

        return (
          <div className="fixed inset-0 bg-black/60 z-40 flex items-end justify-center animate-in fade-in duration-200">
            <div className="bg-stone-50 w-full max-w-md h-[88vh] rounded-t-3xl shadow-2xl flex flex-col overflow-hidden">
              <div className="flex justify-between items-center p-5 pb-3">
                <div>
                  <p className="text-sm font-medium text-lime-700">10월 챌린지</p>
                  <h2 className="text-2xl font-extrabold text-stone-800">{displayDate[1]}월 {displayDate[2]}일의 기록</h2>
                </div>
              </div>

              <div className="px-5 pb-2">
                <div className="flex bg-stone-200/60 p-1 rounded-xl">
                  {users.map(u => (
                    <button 
                      key={u.id} onClick={() => setActiveUserTab(u.id)}
                      className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all truncate px-1 ${activeUserTab === u.id ? 'bg-white shadow-sm text-lime-800' : 'text-stone-500 hover:text-stone-700'}`}
                    >
                      {u.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-5 pt-2 flex flex-col relative">
                <div className="space-y-3 mb-6">
                  {activeUser.goals.map((goalRaw, idx) => {
                    const goal = getGoalObj(goalRaw);
                    const state = checks[idx];
                    return (
                      <div 
                        key={idx} onClick={() => toggleCheck(idx)}
                        className={`flex items-center justify-between p-4 rounded-2xl border-2 transition-all cursor-pointer select-none active:scale-[0.98]
                          ${state === 1 ? 'bg-green-50 border-green-400' : state === 2 ? 'bg-stone-100 border-stone-300' : 'bg-white border-stone-100 shadow-sm'}`}
                      >
                        <div className="flex flex-col">
                          <span className={`text-[15px] font-medium pr-4 line-clamp-1 ${state === 1 ? 'text-green-800' : state === 2 ? 'text-stone-400 line-through' : 'text-stone-700'}`}>
                            {goal.text || '목표 미설정'}
                          </span>
                          <span className={`text-[11px] mt-0.5 font-bold ${state === 1 ? 'text-green-600' : 'text-stone-400'}`}>
                            {goal.freq === 7 ? '매일' : `주 ${goal.freq}회`}
                          </span>
                        </div>
                        <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors border-2
                          ${state === 1 ? 'bg-green-500 border-green-500' : state === 2 ? 'bg-white border-stone-300' : 'bg-stone-50 border-stone-200'}`}
                        >
                          {state === 1 && <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
                          {state === 2 && <span className="text-[10px] font-bold text-stone-400">패스</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="flex-1 flex flex-col justify-end">
                  {userRecord.memo && (
                    <div className="mb-4 flex flex-col items-start animate-in slide-in-from-bottom-2">
                      <div className="relative bg-lime-100 border border-lime-200 py-2.5 px-4 rounded-2xl rounded-bl-none max-w-[85%] shadow-sm">
                        <span className="text-sm font-medium text-lime-900 leading-snug break-all">{userRecord.memo}</span>
                        <div className="absolute -bottom-1.5 left-0 w-3 h-3 bg-lime-100 border-b border-l border-lime-200 transform -rotate-45" />
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-100 mt-2 mb-4">
                  <div className="mb-4">
                    <p className="text-[11px] font-bold text-lime-700 mb-2">📝 한 줄 일기 (내 탭에서만 작성)</p>
                    <div className="flex space-x-2">
                      <input 
                        type="text" maxLength={30} value={memoText} onChange={(e) => setMemoText(e.target.value)}
                        placeholder="오늘의 소감을 남겨주세요 (30자 이내)"
                        className="flex-1 bg-stone-50 border border-stone-200 text-sm rounded-xl px-4 py-2.5 outline-none focus:border-lime-500 focus:ring-1 focus:ring-lime-500"
                      />
                      <button 
                        onClick={() => saveMemo()} disabled={!memoText.trim()}
                        className="bg-lime-700 text-white font-bold px-4 rounded-xl disabled:bg-stone-300 disabled:text-stone-500 transition-colors"
                      >
                        남기기
                      </button>
                    </div>
                  </div>
                  
                  <div className="border-t border-stone-100 pt-3">
                    <p className="text-[11px] font-bold text-pink-500 mb-2">💌 동료 응원하기 (클릭!)</p>
                    <div className="flex space-x-2">
                      {cheerOptions.map(cheer => {
                        const count = (userRecord.emojis || {})[cheer.text] || 0;
                        return (
                          <button 
                            key={cheer.text} onClick={() => handleEmoji(cheer.text)}
                            className="flex-1 flex flex-col items-center justify-center bg-stone-50 hover:bg-stone-100 py-2 rounded-lg border border-stone-200 transition-colors active:bg-stone-200"
                          >
                            <div className="flex items-center space-x-1 mb-1">
                              <span className="text-lg">{cheer.icon}</span>
                              {count > 0 && <span className="text-[10px] font-bold text-pink-500 bg-pink-100 px-1.5 py-0.5 rounded-full">{count}</span>}
                            </div>
                            <span className="text-[10px] font-bold text-stone-600 tracking-tight">{cheer.text}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => setSelectedDate(null)}
                  className="w-full bg-lime-700 text-white font-bold py-4 rounded-2xl shadow-md hover:bg-lime-800 transition active:scale-[0.98] shrink-0"
                >
                  확인
                </button>
              </div>
            </div>
          </div>
        );
      };

      const UserReportModal = () => {
        const user = users.find(u => u.id === reportUserId) || defaultUsers[reportUserId];
        if (!user) return null;

        return (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
            <div className="bg-white w-full max-w-md max-h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-xl">
              <div className="flex justify-between items-center p-5 border-b border-stone-100">
                <div>
                  <p className="text-xs font-bold text-lime-600 mb-0.5">상세 달성 기록</p>
                  <h2 className="font-extrabold text-xl text-stone-800">{user.name} 님의 기록</h2>
                </div>
                <button onClick={() => setReportUserId(null)} className="w-8 h-8 bg-stone-100 rounded-full flex items-center justify-center text-stone-500 hover:bg-stone-200">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>
              
              <div className="overflow-y-auto p-5 space-y-7 flex-1">
                {[0, 1, 2].map(gIdx => {
                  const goal = getGoalObj(user.goals[gIdx]);
                  return (
                    <div key={gIdx}>
                      <div className="flex items-end justify-between mb-2">
                        <span className="text-[14px] font-bold text-lime-800">
                          {gIdx + 1}. {goal.text || '목표 미설정'}
                        </span>
                        <span className="text-[10px] text-stone-400 font-medium bg-stone-100 px-2 py-0.5 rounded-md">
                          {goal.freq === 7 ? '매일' : `주 ${goal.freq}회`}
                        </span>
                      </div>
                      
                      <div className="flex flex-wrap gap-1.5">
                        {Array.from({ length: 30 }, (_, i) => i + 2).map(d => {
                          const dateStr = `2026-10-${String(d).padStart(2, '0')}`;
                          const checks = records[dateStr]?.[reportUserId]?.checks || [0,0,0];
                          const state = getCheckState(checks[gIdx]);
                          
                          let cellClass = "bg-white border border-stone-200 text-stone-300"; 
                          if (state === 1) cellClass = "bg-lime-500 text-white border-lime-500 shadow-sm"; 
                          else if (state === 2) cellClass = "bg-stone-200 text-stone-500 border-stone-200"; 

                          return (
                            <div key={d} className={`w-[1.85rem] h-[1.85rem] flex items-center justify-center rounded-md text-[11px] font-bold ${cellClass}`}>
                              {d}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="p-4 bg-stone-50 border-t border-stone-100 flex justify-center gap-4 text-[11px] font-medium text-stone-500">
                <div className="flex items-center gap-1.5"><div className="w-3.5 h-3.5 bg-lime-500 rounded-sm"></div> 완료</div>
                <div className="flex items-center gap-1.5"><div className="w-3.5 h-3.5 bg-stone-200 rounded-sm"></div> 패스</div>
                <div className="flex items-center gap-1.5"><div className="w-3.5 h-3.5 bg-white border border-stone-200 rounded-sm"></div> 미완료</div>
              </div>
            </div>
          </div>
        );
      };

      const renderCalendar = () => {
        const days = [];
        for (let i = 0; i < 4; i++) days.push(<div key={`empty-${i}`} className="p-2"></div>);

        for (let d = 1; d <= 31; d++) {
          const dateStr = `2026-10-${String(d).padStart(2, '0')}`;
          const isOptional = isOptionalDay(d);
          const isDay1 = d === 1;

          const dayRecord = records[dateStr];
          let completedUsers = 0;
          let userStatusDots = []; 

          if (!isDay1) {
            for (let uid = 0; uid < 4; uid++) {
              const checks = ((dayRecord && dayRecord[uid]?.checks) || [0,0,0]).map(getCheckState);
              const isDone = !checks.includes(0); 
              if (isDone) completedUsers++;
              
              userStatusDots.push(
                <div key={`dot-${uid}`} className={`w-1.5 h-1.5 rounded-full ${isDone ? 'bg-lime-500' : 'bg-stone-300/50'}`} />
              );
            }
          }

          days.push(
            <div 
              key={dateStr}
              onClick={() => isDay1 ? setIsGoalModalOpen(true) : setSelectedDate(dateStr)}
              className={`relative flex flex-col items-center justify-start pt-1.5 pb-2 border-b border-r border-stone-200/50 min-h-[5.5rem] cursor-pointer active:bg-stone-200 transition-colors
                ${isDay1 ? 'bg-lime-50 hover:bg-lime-100' : isOptional ? 'bg-stone-50' : 'bg-white hover:bg-stone-50'}
              `}
            >
              <span className={`text-sm font-semibold z-10 ${isOptional ? 'text-stone-400' : 'text-stone-700'} ${isDay1 ? 'text-lime-700' : ''}`}>
                {d}
              </span>
              
              {isDay1 && <div className="mt-2 text-[10px] font-bold text-lime-600 text-center leading-tight">목표<br/>설정일</div>}
              
              {!isDay1 && (
                <>
                  <div className="absolute inset-0 top-3 flex items-center justify-center pointer-events-none">
                    {completedUsers === 1 || completedUsers === 2 ? (
                      <span className="text-2xl opacity-80 animate-in zoom-in">💧</span>
                    ) : completedUsers === 3 ? (
                      <span className="text-3xl drop-shadow-sm animate-in zoom-in opacity-90">🌱</span>
                    ) : completedUsers === 4 ? (
                      <span className="text-4xl drop-shadow-md animate-[bounce_1.5s_infinite] origin-bottom">🍀</span>
                    ) : null}
                  </div>

                  <div className="absolute bottom-1 w-full flex justify-center space-x-0.5 px-1">
                    {userStatusDots}
                  </div>
                </>
              )}
            </div>
          );
        }

        return (
          <div className="flex-1 overflow-y-auto bg-stone-50 pb-24">
            <div className="bg-white m-4 rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
              <div className="grid grid-cols-7 bg-lime-800 text-white py-2 text-center text-[10px] font-bold tracking-wider">
                <div className="text-red-300">SUN</div>
                <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div>
                <div className="text-blue-300">SAT</div>
              </div>
              <div className="grid grid-cols-7 border-l border-t border-stone-200/50">
                {days}
              </div>
            </div>
            <div className="px-6 space-y-1 text-center text-[10px] font-medium text-stone-400">
              <p>* 주말 및 공휴일(3, 5, 9일)은 선택 참여입니다.</p>
              <p>* "주 N회" 목표의 미수행일에는 [패스]를 눌러주세요.</p>
            </div>
          </div>
        );
      };

      const renderDashboard = () => {
        return (
          <div className="flex-1 flex flex-col bg-stone-50 overflow-hidden relative pb-[4.5rem]">
            <div className="flex-1 grid grid-cols-2 gap-3 p-4 overflow-y-auto">
              {users.map((u) => {
                const overall = calculateProgress(u.id);
                const currentImg = getGrowthImage(u.id, overall);

                return (
                  <div 
                    key={u.id} 
                    onClick={() => setReportUserId(u.id)}
                    className="cursor-pointer bg-white rounded-2xl p-3.5 shadow-sm border border-stone-100 flex flex-col justify-between hover:border-lime-400 hover:shadow-md transition-all active:scale-[0.98]"
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-extrabold text-stone-800 text-[15px] truncate pr-1">
                        {u.name}
                      </span>
                      <div className="shrink-0 bg-lime-50 px-2 py-0.5 rounded-full border border-lime-200">
                        <span className="font-black text-lime-700 text-xs">{overall}%</span>
                      </div>
                    </div>
                    
                    {/* 영문 파일명 일러스트가 들어가는 화분 카드 영역 */}
                    <div className="my-2 bg-stone-50 rounded-xl p-2 border border-stone-100 flex items-center justify-center h-28 relative overflow-hidden shadow-inner">
                      <img 
                        src={currentImg} 
                        alt="growth stage" 
                        className="w-full h-full object-contain drop-shadow-sm transition-all duration-500"
                        style={{ filter: 'saturate(0.8)' }}
                      />
                    </div>

                    <div className="space-y-1.5 mt-auto">
                      {[0, 1, 2].map((idx) => {
                        const pct = calculateProgress(u.id, idx);
                        const goalRaw = u.goals[idx];
                        const goal = getGoalObj(goalRaw);
                        return (
                          <div key={idx} className="flex justify-between items-center text-[11px]">
                            <span className="text-stone-600 truncate mr-2 flex-1">
                              {idx+1}. {goal.text || '-'}
                            </span>
                            <span className={`font-bold shrink-0 ${pct === 100 ? 'text-lime-600' : 'text-stone-400'}`}>
                              {pct}%
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              
              <div className="col-span-2 px-2 py-2 text-center mt-1 border-t border-stone-200/60">
                <p className="text-[10px] font-medium text-stone-400 leading-relaxed">
                  * 주 N회 목표는 달력(일~토) 기준으로 실시간 계산됩니다.<br/>
                  * 한 주에 목표 횟수를 초과 달성해도 주간 100%까지만 반영됩니다.<br/>
                  * 패스는 달성률에 영향을 주지 않는 단순 휴식 표시입니다.
                </p>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="w-full max-w-md mx-auto h-[100dvh] flex flex-col bg-stone-50 font-sans shadow-2xl overflow-hidden relative">
          <header className="bg-white px-5 py-4 flex justify-between items-center shadow-sm z-10 relative border-b border-stone-100 shrink-0">
            <div>
              <h1 className="text-xl font-black text-lime-900 tracking-tight flex items-center">
                <span className="text-2xl mr-1.5">🌿</span> 그리너리 라이프
              </h1>
              <p className="text-[11px] font-bold text-lime-600/80">10월 건강 습관 챌린지</p>
            </div>
            <button 
              onClick={() => setIsGoalModalOpen(true)}
              className="w-9 h-9 flex items-center justify-center bg-stone-100 rounded-full text-stone-600 hover:bg-stone-200 transition"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
          </header>

          {view === 'calendar' ? renderCalendar() : renderDashboard()}

          <nav className="absolute bottom-0 w-full bg-white border-t border-stone-200 flex shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] pb-safe z-30">
            <button 
              onClick={() => setView('calendar')}
              className={`flex-1 flex flex-col items-center justify-center py-3.5 transition-colors ${view === 'calendar' ? 'text-lime-800' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="mb-1"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <span className="text-[10px] font-bold tracking-wide">캘린더</span>
            </button>
            <button 
              onClick={() => setView('dashboard')}
              className={`flex-1 flex flex-col items-center justify-center py-3.5 transition-colors ${view === 'dashboard' ? 'text-lime-800' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="mb-1"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              <span className="text-[10px] font-bold tracking-wide">달성현황</span>
            </button>
          </nav>

          {isGoalModalOpen && <GoalSettingModal />}
          {selectedDate && <DailyDetailModal />}
          {reportUserId !== null && <UserReportModal />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
